<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guess The Number — logo review</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        background: #101e24;
        color: #ede6d6;
        font: 12px/1.5 ui-monospace, monospace;
      }
      h2 {
        font: 600 11px/1 ui-monospace, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7bdcb5;
        margin: 0 0 16px;
      }
      section {
        border: 1px solid #1a2e35;
        padding: 32px;
        border-radius: 12px;
        margin-bottom: 24px;
      }
      .big img {
        max-width: 100%;
        display: block;
      }
      .header-sizes {
        display: flex;
        gap: 40px;
        align-items: center;
      }
      .header-sizes img {
        display: block;
      }
      .marks {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }
      .marks img {
        display: block;
      }
      .light {
        background: #f4f3ef;
      }
    </style>
  </head>
  <body>
    <h2>Header lockup — logo.png</h2>
    <section class="big">
      <img src="../public/brand/logo.png" alt="Guess The Number" />
    </section>

    <h2>Header size — 36px / 40px tall</h2>
    <section class="header-sizes">
      <img src="../public/brand/logo.png" style="height: 36px" alt="36px tall" />
      <img src="../public/brand/logo.png" style="height: 40px" alt="40px tall" />
    </section>

    <h2>Favicon — logo.svg</h2>
    <section class="marks">
      <img src="../public/brand/logo.svg" style="width: 64px" alt="64px" />
      <img src="../public/brand/logo.svg" style="width: 32px" alt="32px" />
      <img src="../public/brand/logo.svg" style="width: 16px" alt="16px" />
    </section>

    <h2>Favicon on a light tab bar</h2>
    <section class="marks light">
      <img src="../public/brand/logo.svg" style="width: 64px" alt="64px" />
      <img src="../public/brand/logo.svg" style="width: 32px" alt="32px" />
      <img src="../public/brand/logo.svg" style="width: 16px" alt="16px" />
    </section>
  </body>
</html>
